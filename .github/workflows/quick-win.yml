# Build a Windows solidcraft.exe on a fork branch for manual verification.
# Run from the Actions tab (Run workflow).
name: quick-win
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-build
      - name: Build the app
        run: cargo build -p solidcraft --profile ci --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: target/ci/solidcraft.exe
          retention-days: 7
